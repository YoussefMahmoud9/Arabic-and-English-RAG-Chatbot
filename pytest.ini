[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: pure logic, no running server required
    live: needs the app running at RAG_TEST_URL (default http://127.0.0.1:7860)
    slow: involves real model inference and can take minutes
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning